# The daily run in the cloud, so the PC does not have to be on.
# 14:45 UTC is 22:45 in Ulaanbaatar, 15 minutes after the New York open in winter.
# The 18:00 UTC run is a backup for a skipped or failed one; it does nothing if the
# session already ran. State lives in trader/engine/ and is committed back here.
name: daily trader

on:
  schedule:
    - cron: "45 14 * * 1-5"
    - cron: "0 18 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trader
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Engine and tournament
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_BACKEND: openai
        run: python3 engine/run.py

      - name: Save state and scoreboard
        run: |
          git config user.name "ai-trader bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trader/engine SCOREBOARD.md
          if git diff --cached --quiet; then echo "Nothing new to save."; exit 0; fi
          git commit -m "Daily run $(date -u +%F)"
          git pull --rebase origin main
          git push origin HEAD:main
